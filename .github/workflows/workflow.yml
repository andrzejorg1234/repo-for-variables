# This is a basic workflow to help you get started with Actions

name: passing job values

# Controls when the workflow will run
on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
  
jobs:
  pass_in_one_job:
    runs-on: ubuntu-latest
    steps:
      - name: Set color
        id: color-selector
        run: echo "COLOR=blue" >> $GITHUB_OUTPUT
      - name: Get color
        env:
          COLOR: ${{ steps.color-selector.outputs.COLOR }}
        run: echo "The selected color is ${COLOR}"
        
  producer:
    runs-on: ubuntu-latest
    steps:
      - name: Make a sentence
        id: sentence_maker
        run: |
            echo "message=Hello, world!" >> $GITHUB_OUTPUT
    outputs:
      full-message: ${{ steps.sentence_maker.outputs.message }}

  consumer:
    runs-on: ubuntu-latest
    needs: producer
    steps:
      - name: Print the message
        env:
          MESSAGE: ${{ needs.producer.outputs.full-message }}
        run: |
          echo ${MESSAGE}

  job_1:
    name: Add 3 and 7
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          expr 3 + 7 > calc_result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: calc_result
          path: calc_result.txt

  job_2:
    name: Multiply by 9
    needs: job_1
    runs-on: windows-latest
    steps:
      - name: Download result
        uses: actions/download-artifact@v4
        with:
          name: calc_result
      - shell: bash
        run: |
          value=`cat calc_result.txt`
          echo $(expr $value \* 9) 